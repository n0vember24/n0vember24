<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мои финансы</title>
<meta name="theme-color" content="#2F5D8A">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script>window.XLSX_SRC='./xlsx.full.min.js';</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F5; --card:#FFFFFF; --text:#1B2430; --muted:#6B7785; --border:#E1E6EA;
  --income:#2F8F6E; --income-bg:#E4F3EC; --expense:#C1533A; --expense-bg:#F8E9E5;
  --debt:#B58A2E; --debt-bg:#F6EEDC; --primary:#2F5D8A; --primary-bg:#E6EEF5;
  --radius:16px; --shadow:0 1px 3px rgba(20,30,40,.06), 0 8px 24px rgba(20,30,40,.04);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111720; --card:#1A2230; --text:#E7ECEF; --muted:#8B96A3; --border:#2B3646;
    --income-bg:#193226; --expense-bg:#2E1E1A; --debt-bg:#2E2716;
    --primary-bg:#1B2A3B;
  }
}
:root[data-theme="dark"]{
  --bg:#111720; --card:#1A2230; --text:#E7ECEF; --muted:#8B96A3; --border:#2B3646;
  --income-bg:#193226; --expense-bg:#2E1E1A; --debt-bg:#2E2716; --primary-bg:#1B2A3B;
}
*{box-sizing:border-box;}
html,body{height:100%;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Manrope',sans-serif;-webkit-font-smoothing:antialiased;}
.app{max-width:640px;margin:0 auto;padding:16px 16px 100px;}
header.top{position:sticky;top:0;padding-top:calc(14px + env(safe-area-inset-top,0px));background:var(--bg);z-index:5;padding-bottom:6px;}
h1{font-size:22px;font-weight:800;margin:0 0 2px;letter-spacing:-.3px;}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px;}
.balances{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.bal-card{background:var(--card);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);}
.bal-card .lbl{font-size:12px;color:var(--muted);font-weight:600;}
.bal-card .val{font-size:20px;font-weight:800;margin-top:4px;}
nav.tabs{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:14px;box-shadow:var(--shadow);margin-bottom:16px;overflow-x:auto;}
nav.tabs button{flex:1;white-space:nowrap;border:0;background:transparent;color:var(--muted);font-family:inherit;font-weight:700;font-size:13px;padding:9px 10px;border-radius:10px;cursor:pointer;}
nav.tabs button.active{background:var(--primary-bg);color:var(--primary);}
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px;}
.card h3{margin:0 0 10px;font-size:15px;font-weight:700;}
.tx{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;}
.tx:last-child{border-bottom:0;}
.tx .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none;}
.tx .info{flex:1;min-width:0;}
.tx .cat{font-weight:700;font-size:14px;}
.tx .meta{font-size:12px;color:var(--muted);}
.tx .amt{font-weight:800;font-size:14px;white-space:nowrap;}
.pos{color:var(--income);} .neg{color:var(--expense);} .neu{color:var(--debt);}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:20px 0;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.opt{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:16px 12px;text-align:center;cursor:pointer;font-weight:700;font-size:14px;box-shadow:var(--shadow);}
.opt .em{font-size:24px;display:block;margin-bottom:6px;}
.opt.expense{border-color:var(--expense-bg);} .opt.income{border-color:var(--income-bg);} .opt.debt{border-color:var(--debt-bg);}
.cat-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font-weight:600;}
.cat-row .em{font-size:18px;}
.cat-row .fn{margin-left:auto;font-size:11px;color:var(--debt);font-weight:700;}
label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:12px 0 5px;}
input,select{width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-family:inherit;font-size:15px;}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:4px;gap:4px;}
.seg button{flex:1;border:0;background:transparent;padding:9px;border-radius:8px;font-family:inherit;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;}
.seg button.active{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08);}
.btnrow{display:flex;gap:10px;margin-top:18px;}
.btn{flex:1;padding:13px;border-radius:12px;border:0;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;}
.btn.primary{background:var(--primary);color:#fff;}
.btn.ghost{background:var(--bg);color:var(--text);}
.fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:min(608px,calc(100% - 32px));background:var(--primary);color:#fff;border:0;border-radius:16px;padding:15px;font-weight:800;font-size:15px;box-shadow:0 8px 24px rgba(47,93,138,.35);cursor:pointer;z-index:6;}
.crumb{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:10px;cursor:pointer;}
.chip{display:inline-block;padding:6px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--border);font-size:13px;font-weight:700;margin:3px 4px 3px 0;cursor:pointer;}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5;}
.debtor{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);}
.debtor:last-child{border-bottom:0;}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--primary-bg);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none;}
.debtor .info{flex:1;} .debtor .name{font-weight:700;font-size:14px;} .debtor .cat{font-size:12px;color:var(--muted);}
.overlay{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:9;display:flex;align-items:flex-end;justify-content:center;}
.sheet{background:var(--bg);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow-y:auto;}
.sheet h2{font-size:17px;margin:0 0 2px;}
.iconbtn{background:var(--card);border:1px solid var(--border);border-radius:10px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;flex:none;}
.toprow{display:flex;justify-content:space-between;align-items:flex-start;}
.small{font-size:12px;color:var(--muted);}
.subcredit{font-size:12px;color:var(--muted);padding:4px 0 4px 46px;}
.bal-card.total{margin-bottom:10px;background:var(--primary);color:#fff;}
.bal-card.total .lbl{color:rgba(255,255,255,.8);}
.bal-card.total .val{font-size:24px;}
.bal-card .subv{font-size:11px;color:var(--muted);font-weight:600;margin-top:3px;}
details.more{margin-top:14px;}
details.more summary{list-style:none;font-size:12px;color:var(--muted);font-weight:700;cursor:pointer;padding:6px 0;display:flex;gap:6px;align-items:center;user-select:none;}
details.more summary::-webkit-details-marker{display:none;}
details.more summary::before{content:'▸';display:inline-block;transition:transform .15s;}
details.more[open] summary::before{transform:rotate(90deg);}
details.more .more-body{border-top:1px solid var(--border);padding-top:2px;}
.donut-wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
.donut{width:140px;height:140px;border-radius:50%;position:relative;flex:none;}
.donut .hole{position:absolute;inset:20px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.donut .hole b{font-size:14px;font-weight:800;line-height:1.15;}
.donut .hole span{font-size:10px;color:var(--muted);font-weight:700;margin-top:2px;}
.legend{flex:1;min-width:160px;}
.legend .li{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px;}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:none;}
.legend .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.legend .vl{font-weight:700;white-space:nowrap;}
.legend .pc{color:var(--muted);font-size:11px;width:34px;text-align:right;}
.rem{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;}
.rem:last-child{border-bottom:0;}
.rem .when{font-size:12px;font-weight:700;color:var(--debt);}
.rem .when.late{color:var(--expense);}
.dayhead{font-size:12px;font-weight:800;color:var(--muted);padding:12px 0 2px;}
.dayhead:first-child{padding-top:0;}
.sortbar{display:flex;gap:6px;align-items:center;margin-bottom:12px;}
.sortbar .seg{flex:1;}
.sortbar .seg button{padding:8px 4px;font-size:12px;}
.big-row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:10px;cursor:pointer;}
.big-row .t{font-weight:800;font-size:15px;}
.big-row .s{font-size:12px;color:var(--muted);margin-top:2px;}
.big-row .v{margin-left:auto;font-weight:800;font-size:15px;text-align:right;}
.rec{background:var(--bg);border-radius:12px;padding:12px;margin:8px 0 4px;}
.rec .rt{font-weight:700;font-size:14px;}
.rec .rs{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5;}
.rec .btnrow{margin-top:10px;}
.rec .btn{padding:10px;font-size:13px;}
.bar{height:6px;border-radius:3px;background:var(--border);overflow:hidden;margin-top:8px;}
.bar i{display:block;height:100%;background:var(--income);}
.preview{background:var(--primary-bg);color:var(--text);border-radius:12px;padding:12px;margin-top:14px;font-size:13px;line-height:1.6;}
.preview b{font-weight:800;}
.btn.danger{background:var(--expense-bg);color:var(--expense);}
.btnrow{flex-wrap:wrap;}
.dlg{font-size:14px;line-height:1.55;margin-top:8px;}
.dlg .ln{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:13px;z-index:20;max-width:90%;text-align:center;}
.late{color:var(--expense);}
.avatar.sm{width:28px;height:28px;font-size:12px;}
.chk{display:flex;align-items:center;gap:8px;margin-top:14px;cursor:pointer;}
.chk input{width:auto;}
.chk span{font-weight:600;font-size:14px;}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
</style>
</head>
<body>
<div id="root" class="app"></div>
<script>
// ================== STATE ==================
const KEY='fintrack', OLD_KEY='fintrack_v1', SCHEMA=2;
function defaultCats(){return [
  {id:'__debt',name:'Долг',kind:'both',em:'🤝',system:true},
  {id:'__gift',name:'Подарок',kind:'both',em:'🎁',system:true},
  {id:'__transfer',name:'Между счетами',kind:'expense',em:'🔁',system:true},
];}
function emptyState(){return {
  schemaVersion:SCHEMA,
  transactions:[], // {id,type,amount,account,categoryId,catSnap,note,counterId,counterSnap,date,createdAt,updatedAt,sys?,debtId?,creditId?,transferId?,fromAcc?,toAcc?,parentId?}
  categories:defaultCats(),
  functional:[],
  ccats:[{id:'family',name:'Семья'},{id:'friends',name:'Друзья'}],
  counterparties:[], // {id,name,ccat}
  debts:[],   // {id,dir:'out'(мне должны)|'in'(я должен),counterId,deadline,openTxId,createdAt,updatedAt,legacyPrincipal?,note?,date?}
  credits:[], // {id,kind:'credit'|'installment',counterId,price,recv:'card'|'cash'|'goods',down,downAcc,term,rate,scheme,firstPay,payDay,product,note,categoryId,date,createdAt,updatedAt}
  settings:{theme:'system',hideCredit:false,hiddenTabs:{tx:false,debts:false,cats:false},remindDays:7}
};}
function uid(){return Math.random().toString(36).slice(2,10);}

function migrateV1(o){
  const s=emptyState(), now=Date.now();
  const userCats=(o.categories||[]).filter(c=>c.id!=='__debt'&&c.id!=='__gift').map(c=>({id:c.id,name:c.name,kind:c.kind||'expense',em:c.em||'💠'}));
  s.categories=[...defaultCats(),...userCats];
  s.functional=o.functional||[];
  if(o.ccats) s.ccats=o.ccats;
  s.counterparties=(o.counterparties||[]).map(p=>({id:p.id,name:p.name,ccat:p.ccat||null}));
  s.settings={...s.settings,...(o.settings||{})};
  s.credits=(o.credits||[]).map(r=>({id:r.id,kind:'credit',counterId:r.counterId||null,price:r.principal||0,recv:'goods',down:0,downAcc:'card',
    term:0,rate:0,scheme:'annuity',firstPay:null,payDay:null,product:'',note:r.note||'',categoryId:null,date:r.ts||now,createdAt:r.ts||now,updatedAt:now,legacy:true}));
  s.transactions=(o.transactions||[]).map(t=>{
    const ts=t.ts||now;
    const n={id:t.id||uid(),type:t.type,amount:t.amount,account:t.account||'cash',categoryId:t.categoryId||null,
      catSnap:t.catName?{name:t.catName,em:t.em||'💠'}:null,note:t.note||'',counterId:t.counterId||null,counterSnap:t.counterName||null,
      date:ts,createdAt:ts,updatedAt:ts};
    if(t.creditId){
      n.creditId=t.creditId;
      n.sys=t.creditAction==='repay'?'credit_pay':'credit_open';
      if(n.sys==='credit_pay'){n.categoryId=null;}
      else {
        if(n.categoryId==='__debt'){n.categoryId=null;n.catSnap={name:'Кредит',em:'📦'};}
        const rec=s.credits.find(r=>r.id===t.creditId); if(rec&&n.categoryId) rec.categoryId=n.categoryId;
      }
    } else if(t.categoryId==='__debt'){ n.sys='legacy_debt'; n.categoryId=null; }
    else if(!t.categoryId&&t.catName==='Кешбэк'){ n.sys='cashback'; }
    return n;
  });
  (o.counterparties||[]).forEach(p=>{
    if(p.balance){ s.debts.push({id:uid(),dir:p.balance>0?'out':'in',counterId:p.id,deadline:null,openTxId:null,
      legacyPrincipal:Math.abs(p.balance),note:'Перенесено из прошлой версии',date:now,createdAt:now,updatedAt:now}); }
  });
  return s;
}
function load(){
  let raw=null;
  try{raw=JSON.parse(localStorage.getItem(KEY));}catch(e){}
  if(!raw){ try{const old=JSON.parse(localStorage.getItem(OLD_KEY)); if(old) raw=migrateV1(old);}catch(e){} }
  const e=emptyState();
  const s={...e,...(raw||{})};
  s.settings={...e.settings,...(s.settings||{})};
  s.settings.hiddenTabs={...e.settings.hiddenTabs,...(s.settings.hiddenTabs||{})};
  ['transactions','categories','functional','ccats','counterparties','debts','credits'].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[];});
  defaultCats().forEach(dc=>{ if(!s.categories.find(c=>c.id===dc.id)) s.categories.push(dc); });
  s.credits.forEach(c=>{const p=s.counterparties.find(x=>x.id===c.counterId); if(p&&p.creditor===undefined) p.creditor=true;});
  s.schemaVersion=SCHEMA;
  return s;
}
let S=load();
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('Не удалось сохранить данные в памяти браузера');} }

// ================== FORMAT / DATE ==================
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function groupNum(v){const s=String(v).replace(/\D/g,'');return s.replace(/\B(?=(\d{3})+(?!\d))/g,' ');}
function fmt(n){n=Math.round(n||0);const neg=n<0;n=Math.abs(n);return (neg?'-':'')+groupNum(n.toFixed(0))+' сум';}
function pad(n){return String(n).padStart(2,'0');}
function sod(ms){const d=new Date(ms);d.setHours(0,0,0,0);return d.getTime();}
function dayDiff(ms){return Math.round((sod(ms)-sod(Date.now()))/864e5);}
function fmtD(ms){const d=new Date(ms);return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear();}
function fmtDT(ms){const d=new Date(ms);return fmtD(ms)+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function fmtT(ms){const d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes());}
function toDTInput(ms){const d=new Date(ms);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());}
function toDInput(ms){if(!ms)return '';const d=new Date(ms);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fromInput(v){if(!v)return null;const [dp,tp]=v.split('T');const [y,m,d]=dp.split('-').map(Number);if(!y||!m||!d)return null;const [hh,mm]=(tp||'00:00').split(':').map(Number);return new Date(y,m-1,d,hh||0,mm||0).getTime();}
const MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
function dayTitle(ms){const dd=dayDiff(ms);if(dd===0)return 'Сегодня';if(dd===-1)return 'Вчера';const d=new Date(ms);return d.getDate()+' '+MONTHS[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'');}
function relDays(diff){if(diff<0)return 'просрочено на '+(-diff)+' дн.';if(diff===0)return 'сегодня';if(diff===1)return 'завтра';return 'через '+diff+' дн.';}
function addMonths(ms,i,day){const d=new Date(ms);const y=d.getFullYear(),m=d.getMonth()+i;const dim=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(day||d.getDate(),dim)).getTime();}
function parseNum(v){const n=parseFloat(String(v||'').replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:0;}

// ================== LOOKUPS ==================
function findCat(id){return id?(S.categories.find(c=>c.id===id)||S.functional.find(c=>c.id===id)||null):null;}
function getCp(id){return id?S.counterparties.find(p=>p.id===id)||null:null;}
function cpName(id,snap){const p=getCp(id);return p?p.name:(snap||'');}
function recCp(r){return r?cpName(r.counterId,r.counterSnap):'';}
function initial(n){return (Array.from(String(n||'?'))[0]||'?').toUpperCase();}
function getCredit(id){return S.credits.find(c=>c.id===id)||null;}
function getDebt(id){return S.debts.find(d=>d.id===id)||null;}
function accName(a){return a==='card'?'Карта':(a==='cash'?'Наличные':'Кредит/рассрочка');}
function sum(arr,f){return arr.reduce((s,x)=>s+f(x),0);}

// ================== DERIVED ==================
function accBalance(acc){return sum(S.transactions.filter(t=>t.account===acc),t=>t.type==='income'?t.amount:-t.amount);}

function debtOpenTx(d){return d.openTxId?S.transactions.find(t=>t.id===d.openTxId)||null:null;}
function debtPrincipal(d){const t=debtOpenTx(d);return t?t.amount:(d.legacyPrincipal||0);}
function debtPays(d){return S.transactions.filter(t=>t.sys==='debt_pay'&&t.debtId===d.id);}
function debtRemaining(d){return Math.max(0,debtPrincipal(d)-sum(debtPays(d),t=>t.amount));}
function debtDate(d){const t=debtOpenTx(d);return t?t.date:(d.date||d.createdAt);}
function debtNote(d){const t=debtOpenTx(d);return t?t.note:(d.note||'');}
function openDebts(dir,counterId){return S.debts.filter(d=>(!dir||d.dir===dir)&&(!counterId||d.counterId===counterId)&&debtRemaining(d)>0);}

function crPrincipal(c){return Math.max(0,(c.price||0)-(c.recv==='goods'?(c.down||0):0));}
function crSchedule(c){
  const P=crPrincipal(c), n=parseInt(c.term)||0;
  if(!n||!c.firstPay||P<=0) return [];
  const r=(c.kind==='credit'?(+c.rate||0):0)/1200;
  const A=r>0?P*r/(1-Math.pow(1+r,-n)):P/n;
  const out=[]; let rem=P;
  for(let i=0;i<n;i++){
    const interest=Math.round(rem*r);
    let princ=(c.kind==='credit'&&c.scheme==='diff')?Math.round(P/n):Math.round(A)-interest;
    if(i===n-1||princ>rem) princ=rem;
    rem-=princ;
    out.push({i,date:i===0?sod(c.firstPay):addMonths(c.firstPay,i,c.payDay),principal:princ,interest,amount:princ+interest});
  }
  return out;
}
function crTotal(c){const s=crSchedule(c);return s.length?sum(s,x=>x.amount):crPrincipal(c);}
function crInterest(c){return sum(crSchedule(c),x=>x.interest);}
function crPays(c){return S.transactions.filter(t=>t.sys==='credit_pay'&&t.creditId===c.id);}
function crPaid(c){return sum(crPays(c),t=>t.amount);}
function crRemaining(c){return Math.max(0,crTotal(c)-crPaid(c));}
function crNext(c){
  const s=crSchedule(c); if(!s.length) return null;
  const paid=crPaid(c); const today=sod(Date.now()); let cum=0;
  for(const x of s){
    cum+=x.amount;
    if(cum>paid){
      const lim=Math.max(today,x.date);
      const due=sum(s.filter(y=>y.date<=lim),y=>y.amount)-paid;
      return {date:x.date,amount:Math.max(0,Math.min(due,crRemaining(c))),monthly:x.amount};
    }
  }
  return null;
}
function crMonthly(c){const nx=crNext(c);return nx?nx.monthly:0;}
function monthlyTotal(kind){return sum(openCredits(kind),crMonthly);}
function crTitle(c){
  if(c.kind==='installment') return c.product||'Рассрочка';
  return c.note||('Кредит от '+fmtD(c.date));
}
function openCredits(kind,counterId){return S.credits.filter(c=>(!kind||c.kind===kind)&&(!counterId||c.counterId===counterId)&&crRemaining(c)>0);}

function syncCreditTxs(c){
  S.transactions=S.transactions.filter(t=>!(t.creditId===c.id&&(t.sys==='credit_open'||t.sys==='credit_down')));
  const note=c.kind==='installment'?(c.product+(c.note?' — '+c.note:'')):(c.note||'');
  const base={creditId:c.id,counterId:c.counterId,date:c.date,createdAt:c.createdAt,updatedAt:Date.now()};
  if(c.kind==='credit'&&c.recv!=='goods'){
    S.transactions.push({id:uid(),...base,type:'income',amount:c.price,account:c.recv,sys:'credit_open',categoryId:null,catSnap:{name:'Получен кредит',em:'🏦'},note});
  } else {
    const snap=c.categoryId?null:{name:'Кредит',em:'📦'};
    S.transactions.push({id:uid(),...base,type:'expense',amount:crPrincipal(c),account:'credit',sys:'credit_open',categoryId:c.categoryId||null,catSnap:snap,note});
    if(c.down>0) S.transactions.push({id:uid(),...base,type:'expense',amount:c.down,account:c.downAcc||'card',sys:'credit_down',categoryId:c.categoryId||null,catSnap:snap,note:'Первоначальный взнос'+(note?' — '+note:'')});
  }
}

// Sheets are mirrored into browser history so the Android «Назад» button closes the top sheet instead of the app
const sheetStack=[]; let histOK=true, ignorePops=0;
let pendingBack=0, backTimer=null;
function histPush(tag){
  if(!histOK)return;
  if(pendingBack>0){pendingBack--;if(!pendingBack){clearTimeout(backTimer);backTimer=null;}return;} // reuse an entry that was about to be popped
  try{history.pushState({ft:tag},'');}catch(e){histOK=false;}
}
function histBack(n){
  if(!histOK||n<=0)return;
  pendingBack+=n;
  if(!backTimer) backTimer=setTimeout(()=>{const k=pendingBack;pendingBack=0;backTimer=null;if(!k)return;ignorePops++;try{history.go(-k);}catch(e){histOK=false;ignorePops=0;}},0);
}
window.addEventListener('popstate',()=>{
  if(ignorePops>0){ignorePops--;return;}
  if(sheetStack.length){const ov=sheetStack.pop();ov.remove();if(!sheetStack.length&&wizSheet&&!wizSheet.isConnected){wiz=null;wizSheet=null;wizHist=[];}return;}
  if(tab==='debts'&&debtView){debtView=null;debtExpand=null;render();}
});

  document.body.appendChild(ov); sheetStack.push(ov); histPush('sheet');
  return ov.querySelector('.sheet');
}
function closeTop(){const ov=sheetStack.pop(); if(ov){ov.remove();histBack(1);}}
function closeAll(){const n=sheetStack.length;while(sheetStack.length) sheetStack.pop().remove();histBack(n);}

const COLORS=['#2F5D8A','#2F8F6E','#C1533A','#B58A2E','#7C5CBF','#3E9AA8','#B0568A','#6B7785'];
function donut(data,centerLabel,opts){
  opts=opts||{};
  data=data.filter(d=>d.value>0).sort((a,b)=>b.value-a.value);
  if(data.length>8){const rest=data.slice(7);data=data.slice(0,7);data.push({name:'Другое',value:sum(rest,x=>x.value)});}
  const total=sum(data,d=>d.value);
  if(!total) return el(`<div class="empty">${esc(opts.empty||'Нет данных')}</div>`);
  let acc=0; const stops=[];
  data.forEach((d,i)=>{const c=d.color||COLORS[i%COLORS.length];const a=acc/total*360;acc+=d.value;stops.push(`${c} ${a}deg ${acc/total*360}deg`);});
  const wrap=el(`<div class="donut-wrap"><div class="donut" style="background:conic-gradient(${stops.join(',')})"><div class="hole"><b>${groupNum(Math.round(total).toFixed(0))}</b><span>${esc(centerLabel)}</span></div></div><div class="legend"></div></div>`);
  const lg=wrap.querySelector('.legend');
  data.forEach((d,i)=>{
    const pct=Math.round(d.value/total*100);
    lg.appendChild(el(`<div class="li"><span class="sw" style="background:${d.color||COLORS[i%COLORS.length]}"></span><span class="nm">${esc(d.name)}</span><span class="vl">${groupNum(Math.round(d.value).toFixed(0))}</span><span class="pc">${pct}%</span></div>`));
  });
  return wrap;
}

function reminders(){
  const days=Math.max(0,parseInt(S.settings.remindDays)||7), items=[];
  S.debts.forEach(d=>{
    if(!d.deadline) return; const rem=debtRemaining(d); if(rem<=0) return;
    const diff=dayDiff(d.deadline); if(diff>days) return;
    const n=recCp(d)||'Без контрагента';
    items.push({date:d.deadline,diff,amount:rem,em:'🤝',
      title:d.dir==='out'?`${n} должен вернуть вам`:`Вернуть долг: ${n}`,
      sub:debtNote(d),act:()=>wizStart({step:'debtPay',debtId:d.id})});
  });
  if(!S.settings.hideCredit) S.credits.forEach(c=>{
    if(crRemaining(c)<=0) return; const nx=crNext(c); if(!nx) return;
    const diff=dayDiff(nx.date); if(diff>days) return;
    items.push({date:nx.date,diff,amount:nx.amount,em:'📦',
      title:(c.kind==='installment'?'Рассрочка: ':'Кредит: ')+(recCp(c)||''),
      sub:crTitle(c),act:()=>wizStart({step:'kPay',creditId:c.id})});
  });
  return items.sort((a,b)=>a.date-b.date);
}

    const tot=sum(list,t=>t.type==='income'?t.amount:-t.amount);
    l.appendChild(el(`<div class="small" style="font-weight:700;margin-bottom:6px;">Найдено: ${list.length} · итого ${tot>0?'+':''}${fmt(tot)}</div>`));
  }
  if(!list.length) l.appendChild(el(`<div class="empty">${S.transactions.length?'Нет операций по выбранному фильтру':'Список пуст'}</div>`));
  let lastHead=null;
  list.forEach(t=>{
    let head=null;
    if(txSort.by==='date') head=dayTitle(t.date);

    if(head!==null&&head!==lastHead){l.appendChild(el(`<div class="dayhead">${esc(head)}</div>`));lastHead=head;}
    l.appendChild(txRow(t));
  });

  return box;
}
function txRow(t){
  const isIncome=t.type==='income';

  const bg=t.sys==='transfer'?'var(--primary-bg)':(isDebtish?'var(--debt-bg)':(isIncome?'var(--income-bg)':'var(--expense-bg)'));
  const cls=t.sys==='transfer'?'neu':(isIncome?'pos':'neg');
  const cp=cpName(t.counterId,t.counterSnap);
  const fnl=t.functionalId&&t.functionalId!==t.categoryId?S.functional.find(f=>f.id===t.functionalId):null;
  const meta=[fmtDT(t.date), txAccLabel(t), fnl?'⚡ '+fnl.name:'', cp, t.note].filter(Boolean).map(esc).join(' · ');
  const row=el(`<div class="tx">
    <div class="ic" style="background:${bg}">${esc(txIcon(t))}</div>

function renderCreditPage(kind){

      rc.querySelector('.iconbtn').onclick=()=>wizStart({step:'kForm',editId:c.id}); body.appendChild(rc);});

function creditRecCard(c){
  const total=crTotal(c), paid=crPaid(c), nx=crNext(c), sch=crSchedule(c);
  const parts=[];
  if(c.kind==='credit'&&sch.length) parts.push(`${c.rate||0}% годовых · ${c.term} мес. · проценты ${fmt(crInterest(c))}`);
  if(c.kind==='installment'&&sch.length) parts.push(`${c.term} мес. · ${fmt(sch[0].amount)}/мес`);
  if(c.kind==='credit'&&sch.length) parts.push(`Платёж ${fmt(sch[0].amount)}${c.scheme==='diff'?' (первый)':''}/мес`);
  if(nx) parts.push(`Следующий: ${fmtD(nx.date)} — ${fmt(nx.amount)} (<span class="${dayDiff(nx.date)<0?'late':''}">${relDays(dayDiff(nx.date))}</span>)`);
  if(!sch.length) parts.push('График не задан — укажите срок и дату первой оплаты в «Изменить»');
  if(c.note&&c.kind==='installment') parts.push(esc(c.note));
  const pct=total?Math.min(100,Math.round(paid/total*100)):0;
  const rc=el(`<div class="rec"><div class="rt">${esc(crTitle(c))}</div>
    <div class="rs">Осталось <b>${fmt(crRemaining(c))}</b> из ${fmt(total)}<br>${parts.join('<br>')}</div>
    <div class="bar"><i style="width:${pct}%"></i></div></div>`);
  rc.appendChild(btnRow([
    {label:'Изменить',cls:'ghost',onClick:()=>wizStart({step:'kForm',editId:c.id})},
    {label:'Оплатить',cls:'primary',onClick:()=>wizStart({step:'kPay',creditId:c.id})},
  ]));
  return rc;
}

async function saveFile(filename,data){
  // Inside the claude.ai viewer downloads go through the platform; standalone (PWA/APK) uses a normal download
  if(window.claude&&typeof window.claude.use==='function'){
    let dl=null; try{dl=await window.claude.use('downloads');}catch(e){}
    if(dl){
      try{await dl.save({filename,data});toast('Файл сохранён: '+filename);}
      catch(e){if(e&&e.code!=='declined')toast('Не удалось сохранить файл'+(e&&e.message?': '+e.message:''));}
      return;
    }
  }
  const blob=data instanceof Blob?data:new Blob([data]);
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
}

function validateImport(obj){
  let data=obj&&obj.app==='fintrack'&&obj.data?obj.data:obj;
  if(!data||typeof data!=='object') throw new Error('Файл не похож на резервную копию');
  if(!data.schemaVersion&&Array.isArray(data.transactions)&&data.balances) data=migrateV1(data); // файл из первой версии
  if(!Array.isArray(data.transactions)||!Array.isArray(data.categories)) throw new Error('В файле нет операций или категорий');
  const bad=data.transactions.find(t=>!t||!t.id||(t.type!=='income'&&t.type!=='expense')||!(t.amount>=0)||!t.date);
  if(bad) throw new Error('Повреждённая операция в файле');
  if((data.schemaVersion||0)>SCHEMA) throw new Error('Копия создана более новой версией приложения');
  return data;
}

// Overpayment guard shared by debts and credits
function payWithOverflow(o){
  const remMain=o.remOf(o.main);
  if(o.amount<=remMain) return o.commit([{rec:o.main,amt:o.amount}]);
  const pool=[o.main,...o.others];
  const max=sum(pool,o.remOf);
  const alloc=[]; let left=Math.min(o.amount,max);
  pool.forEach(r=>{if(left<=0)return;const a=Math.min(left,o.remOf(r));if(a>0){alloc.push({rec:r,amt:a});left-=a;}});
  const lines=alloc.map(({rec,amt})=>`<div class="ln"><span>${esc(o.label(rec))}</span><b>${fmt(amt)}${amt>=o.remOf(rec)?' — закроется':''}</b></div>`).join('');
  if(!o.others.length){
    return dialog('Сумма больше долга',`Вы вводите ${fmt(o.amount)}, а остаток по этой записи — ${fmt(remMain)}. Других открытых записей у «${esc(o.who)}» нет.`,
      [{label:'Изменить сумму'},{label:'Внести '+fmt(remMain),cls:'primary',onClick:()=>o.commit([{rec:o.main,amt:remMain}])}]);
  }
  if(o.amount>max){
    return dialog('Сумма больше всего долга',`Вы вводите ${fmt(o.amount)}, а общий остаток по всем записям «${esc(o.who)}» — ${fmt(max)} (лишние ${fmt(o.amount-max)}). Можно внести ${fmt(max)} и закрыть все записи:${lines}`,
      [{label:'Изменить сумму'},{label:'Закрыть все',cls:'primary',onClick:()=>o.commit(alloc)}]);
  }
  dialog('Сумма больше долга по записи',`Остаток по выбранной записи — ${fmt(remMain)}, лишние ${fmt(o.amount-remMain)}. Перенести их на записи с ближайшим сроком? Для каждой будет создана отдельная операция:${lines}`,
    [{label:'Изменить сумму'},{label:'Распределить',cls:'primary',onClick:()=>o.commit(alloc)}]);
}

    cpPicker(b,S.counterparties.filter(p=>p.creditor),p=>wizGo({step:'kForm',kind:k,counterId:p.id}),{empty:'Кредиторов пока нет — добавьте нового',presetCreditor:true});
  } else {
    b.appendChild(el(`<h2>Оплата: ${KIND_LBL[k].toLowerCase()} — контрагент</h2>`));
    const ids=new Set(openCredits(k).map(c=>c.counterId));
    cpPicker(b,S.counterparties.filter(p=>ids.has(p.id)),p=>wizGo({step:'kRec',kind:k,counterId:p.id}),
      {allowNew:false,empty:k==='credit'?'Нет активных кредитов':'Нет активных рассрочек',right:p=>fmt(sum(openCredits(k,p.id),crRemaining))});
  }
};
WIZ.kRec=b=>{
  b.appendChild(el(`<div><h2>${esc(cpName(wiz.counterId))}</h2><p class="small">${wiz.kind==='credit'?'Какой кредит оплачиваете?':'Какой товар / услугу оплачиваете?'}</p></div>`));
  openCredits(wiz.kind,wiz.counterId).forEach(c=>{
    const nx=crNext(c);
    const r=el(`<div class="cat-row" style="align-items:flex-start;"><div style="flex:1;"><div>${esc(crTitle(c))}</div>
      <div class="small">осталось ${fmt(crRemaining(c))}${nx?' · след. платёж '+fmtD(nx.date)+' — '+fmt(nx.amount):''}</div></div></div>`);
    r.onclick=()=>wizGo({step:'kPay',creditId:c.id}); b.appendChild(r);
  });
};
function crOrder(a,b){const na=crNext(a),nb=crNext(b);return (na?na.date:Infinity)-(nb?nb.date:Infinity)||a.date-b.date;}
WIZ.kPay=b=>{
  const c=getCredit(wiz.creditId); if(!c){b.appendChild(el(`<div class="empty">Запись не найдена</div>`));return;}
  const rem=crRemaining(c), nx=crNext(c);
  b.appendChild(el(`<div><h2>Оплата: ${esc(crTitle(c))}</h2><p class="small">${esc(recCp(c))} · осталось ${fmt(rem)}${nx?' · платёж '+fmtD(nx.date)+' — '+fmt(nx.amount):''}</p></div>`));
  if(rem<=0){b.appendChild(el(`<div class="empty">Эта запись уже погашена</div>`));return;}
  const monthlyDue=nx&&nx.amount>0?nx.amount:rem;
  b.appendChild(lbl('Сумма')); const amtI=makeAmountInput(monthlyDue); b.appendChild(amtI);
  const full=el(`<label class="chk"><input type="checkbox"><span>Оплатить полностью (${fmt(rem)})</span></label>`); b.appendChild(full);
  const fullI=full.querySelector('input');
  fullI.onchange=()=>{amtI.value=groupNum(String(fullI.checked?rem:monthlyDue));};
  amtI.addEventListener('input',()=>{if(fullI.checked&&parseAmountInput(amtI)!==rem)fullI.checked=false;});
  b.appendChild(lbl('Откуда платите')); const acc=accSeg('card'); b.appendChild(acc.node);
  b.appendChild(lbl('Заметка (необязательно)')); const noteI=el(`<input placeholder="Комментарий">`); b.appendChild(noteI);
  const det=detailsBlock(Date.now());
  b.appendChild(btnRow([{label:'Отмена',onClick:wizClose},{label:'Сохранить',cls:'primary',onClick:()=>{
    const amount=parseAmountInput(amtI); if(!(amount>0)) return toast('Введите сумму больше нуля');
    const account=acc.get(), date=det.getDate(), note=noteI.value.trim();
    const others=S.credits.filter(x=>x.id!==c.id&&x.kind===c.kind&&x.counterId===c.counterId&&crRemaining(x)>0).sort(crOrder);
    payWithOverflow({amount,main:c,others,remOf:crRemaining,label:crTitle,who:recCp(c),
      commit:alloc=>{const now=Date.now();alloc.forEach(({rec,amt},i)=>S.transactions.push({id:uid(),type:'expense',amount:amt,account,categoryId:null,catSnap:null,
        sys:'credit_pay',creditId:rec.id,note,counterId:rec.counterId,date,createdAt:now+i,updatedAt:now}));wizDone();}});
  }}]));
  b.appendChild(det.node);
};

WIZ.kForm=b=>{
  const ed=wiz.editId?getCredit(wiz.editId):null;
  const kind=ed?ed.kind:wiz.kind, isCr=kind==='credit';
  const now=Date.now();
  const v=ed?{...ed}:{kind,counterId:wiz.counterId,price:0,recv:isCr?'card':'goods',down:0,downAcc:'card',term:12,rate:'',scheme:'annuity',
    firstPay:null,payDay:null,product:'',note:'',categoryId:null,date:now};
  const baseDate=v.date||now;
  b.appendChild(el(`<h2>${ed?'Изменить: ':''}${KIND_LBL[kind]}${ed?'':' — '+esc(cpName(v.counterId))}</h2>`));
  let cps=null;
  if(ed){b.appendChild(lbl(isCr?'Кто выдал':'У кого')); cps=cpSelect(v.counterId,null,{creditors:true}); b.appendChild(cps.node);}
  let prodI=null;
  if(!isCr){b.appendChild(lbl('Товар / услуга')); prodI=el(`<input placeholder="Например, iPhone 16" value="${esc(v.product)}">`); b.appendChild(prodI);}
  let recv=null;
  if(isCr){b.appendChild(lbl('Что получили'));}
  const priceLbl=lbl('');
  const amtI=makeAmountInput(v.price);
  const termI=el(`<input type="number" inputmode="numeric" min="1" max="600" placeholder="12" value="${v.term||''}">`);
  const rateI=el(`<input type="text" inputmode="decimal" placeholder="Например, 24" value="${v.rate===''||v.rate==null?'':v.rate}">`);
  const catBox=el(`<div></div>`);
  const catSel=expenseCatSelect(v.categoryId,isCr?'Без категории (запишется как «Кредит»)':'Выберите категорию');
  catBox.appendChild(lbl(isCr?'Категория покупки (необязательно)':'Категория')); catBox.appendChild(catSel.node);
  const firstI=el(`<input type="date" value="${toDInput(v.firstPay||addMonths(baseDate,1))}">`);
  const dayI=el(`<input type="number" inputmode="numeric" min="1" max="31" value="${v.payDay||new Date(v.firstPay||addMonths(baseDate,1)).getDate()}">`);
  let dayTouched=!!(ed&&ed.payDay);
  dayI.addEventListener('input',()=>{dayTouched=true;upd();});
  firstI.addEventListener('input',()=>{const f=fromInput(firstI.value);if(f&&!dayTouched)dayI.value=new Date(f).getDate();upd();});
  const noteI=el(`<input placeholder="${isCr?'Например, на ремонт':'Комментарий'}" value="${esc(v.note)}">`);
  const downBox=el(`<div></div>`);
  const downI=makeAmountInput(v.down); const downAcc=accSeg(v.downAcc||'card');
  downBox.appendChild(lbl('Первоначальный взнос (необязательно)')); downBox.appendChild(downI);
  downBox.appendChild(lbl('Взнос оплачен с')); downBox.appendChild(downAcc.node);
  const schemeBox=el(`<div></div>`); let scheme=null;
  if(isCr){schemeBox.appendChild(lbl('Схема погашения'));scheme=segCtl([['annuity','Равные платежи'],['diff','Убывающие платежи']],v.scheme||'annuity',()=>upd());schemeBox.appendChild(scheme.node);
    schemeBox.appendChild(el(`<div class="note">Равные (аннуитет) — одинаковая сумма каждый месяц, так считают большинство банков. Убывающие (дифференцированные) — тело долга делится поровну, проценты начисляются на остаток, поэтому платёж уменьшается.</div>`));}
  const preview=el(`<div class="preview"></div>`);

  // layout
  if(isCr){
    recv=segCtl([['card','Деньги на карту'],['cash','Наличными'],['goods','Товар/услуга']],v.recv||'card',()=>{toggle();upd();});
    b.appendChild(recv.node);
  }
  b.appendChild(priceLbl); b.appendChild(amtI);
  b.appendChild(lbl('Срок, месяцев')); b.appendChild(termI);
  if(isCr){b.appendChild(lbl('Процент, годовых')); b.appendChild(rateI);}
  b.appendChild(catBox);
  if(!isCr){b.appendChild(lbl('Дата первой оплаты')); b.appendChild(firstI);}
  b.appendChild(lbl('Комментарий (необязательно)')); b.appendChild(noteI);
  b.appendChild(preview);

  const extra=[];
  if(isCr){extra.push(schemeBox);const fl=lbl('Дата первой оплаты');extra.push(fl);extra.push(firstI);}
  extra.push(lbl('День оплаты каждого месяца')); extra.push(dayI);
  extra.push(downBox);
  const det=detailsBlock(v.date,extra,{dateLabel:'Дата и время оформления'});

  function goods(){return !isCr||recv.get()==='goods';}
  function toggle(){
    const g=goods();
    priceLbl.textContent=isCr?(g?'Стоимость товара/услуги':'Сумма кредита'):'Стоимость';
    catBox.style.display=(!isCr||g)?'block':'none';
    downBox.style.display=g?'block':'none';
  }
  function collect(){
    return {kind,counterId:cps?cps.get():v.counterId,price:parseAmountInput(amtI),recv:isCr?recv.get():'goods',
      down:goods()?parseAmountInput(downI):0,downAcc:downAcc.get(),term:parseInt(termI.value)||0,rate:isCr?parseNum(rateI.value):0,
      scheme:isCr?scheme.get():'annuity',firstPay:fromInput(firstI.value),payDay:Math.min(31,Math.max(1,parseInt(dayI.value)||1)),
      product:prodI?prodI.value.trim():'',note:noteI.value.trim(),categoryId:(!isCr||goods())?catSel.get():null};
  }
  function upd(){
    const c=collect(); const P=crPrincipal(c); const sch=crSchedule(c);
    if(!c.price||!c.term){preview.innerHTML='Введите сумму и срок — здесь появится расчёт.';return;}
    if(c.down>=c.price){preview.innerHTML='<span class="late">Взнос должен быть меньше стоимости.</span>';return;}
    if(!sch.length){preview.innerHTML='Укажите дату первой оплаты.';return;}
    const tot=sum(sch,x=>x.amount), intr=sum(sch,x=>x.interest);
    const pay=isCr&&c.scheme==='diff'?`от <b>${fmt(sch[0].amount)}</b> до <b>${fmt(sch[sch.length-1].amount)}</b>`:`<b>${fmt(sch[0].amount)}</b>`;
    preview.innerHTML=`Долг: <b>${fmt(P)}</b>${c.down>0?` (взнос ${fmt(c.down)})`:''}<br>Платёж в месяц: ${pay}<br>`+
      (isCr?`Переплата (проценты): <b>${fmt(intr)}</b><br>`:'')+`Всего к выплате: <b>${fmt(tot)}</b><br>Последний платёж: ${fmtD(sch[sch.length-1].date)}`;
  }
  [amtI,termI,rateI,downI].forEach(i=>i.addEventListener('input',upd));
  toggle(); upd();

  const save_=()=>{
    const c=collect();
    if(!c.counterId) return toast('Выберите контрагента');
    if(!isCr&&!c.product) return toast('Укажите товар или услугу');
    if(!(c.price>0)) return toast('Введите сумму');
    if(!(c.term>=1)) return toast('Укажите срок в месяцах');
    if(!c.firstPay) return toast('Укажите дату первой оплаты');
    if(isCr&&c.rate<0) return toast('Процент не может быть отрицательным');
    if(!isCr&&!c.categoryId) return toast('Выберите категорию');
    if(c.down>=c.price&&goods()) return toast('Взнос должен быть меньше стоимости');
    const date=det.getDate();
    if(ed){
      const paid=crPaid(ed); const tot=crTotal({...ed,...c});
      if(tot<paid) return toast('Уже оплачено '+fmt(paid)+' — сумма договора не может быть меньше');
      Object.assign(ed,c,{date,updatedAt:Date.now()}); delete ed.legacy;
      S.transactions.forEach(t=>{if(t.creditId===ed.id)t.counterId=ed.counterId;});
      syncCreditTxs(ed);
    } else {
      const rec={id:uid(),...c,date,createdAt:Date.now(),updatedAt:Date.now()};
      S.credits.push(rec); syncCreditTxs(rec);
    }
    wizDone();
  };
  const btns=[];
  if(ed) btns.push({label:'Удалить',cls:'danger',onClick:()=>{
    const linked=S.transactions.filter(t=>t.creditId===ed.id);
    dialog('Удалить запись?',`Будут удалены сама запись и все связанные операции (${linked.length}), включая оплаты. Балансы пересчитаются.`,
      [{label:'Отмена'},{label:'Удалить',cls:'danger',onClick:()=>{S.transactions=S.transactions.filter(t=>t.creditId!==ed.id);S.credits=S.credits.filter(x=>x.id!==ed.id);wizDone();}}]);
  }});
  else btns.push({label:'Отмена',onClick:wizClose});
  btns.push({label:'Сохранить',cls:'primary',onClick:save_});
  b.appendChild(btnRow(btns));
  b.appendChild(det.node);
};

render();
</script>
<script>
if('serviceWorker' in navigator && location.protocol==='https:'){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
